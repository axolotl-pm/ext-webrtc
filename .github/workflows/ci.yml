name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LIBDATACHANNEL_VERSION: v0.24.5

jobs:
  linux:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    name: Linux (PHP ${{ matrix.php }}, ZTS=${{ matrix.zts }})

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        zts: ['ts', 'nts']

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
          ini-values: memory_limit=-1
        env:
          phpts: ${{ matrix.zts }}

      - name: Cache libdatachannel
        id: libdatachannel-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/libdatachannel-install
          key: libdatachannel-${{ env.LIBDATACHANNEL_VERSION }}-ubuntu-24.04

      - name: Install libdatachannel build dependencies
        if: steps.libdatachannel-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev

      - name: Build libdatachannel
        if: steps.libdatachannel-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --recursive -b "$LIBDATACHANNEL_VERSION" https://github.com/paullouisageneau/libdatachannel.git
          cmake -S libdatachannel -B libdatachannel/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/libdatachannel-install" \
            -DNO_EXAMPLES=ON -DNO_TESTS=ON -DNO_MEDIA=ON
          cmake --build libdatachannel/build --config Release --parallel
          cmake --install libdatachannel/build

      - name: Build extension
        run: |
          phpize
          ./configure --enable-webrtc --with-libdatachannel="$GITHUB_WORKSPACE/libdatachannel-install"
          make -j$(nproc)

      - name: Run PHPT tests
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/libdatachannel-install/lib:$LD_LIBRARY_PATH"
          REPORT_EXIT_STATUS=1 NO_INTERACTION=1 TEST_PHP_ARGS="--show-diff" make test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-php${{ matrix.php }}-${{ matrix.zts }}
          path: |
            ${{ github.workspace }}/tests/**/*.log
            ${{ github.workspace }}/tests/**/*.out
            ${{ github.workspace }}/tests/**/*.diff
